<script>
(function(){
  try{
    const pref=localStorage.getItem('b_theme_pref')||localStorage.getItem('b_theme')||'light';
    const dark=pref==='dark'||(pref==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.dataset.theme=dark?'dark':'light';
  }catch{}
})();
</script>
<style>
:root{--bg:#f4f0e7;--card:#fffdf8;--text:#1d2921;--muted:#677269;--accent:#315f43;--accent2:#e4eee6;--line:#d8ded8;--gold:#9a731d;--danger:#9b3d32;--shadow:0 10px 30px rgba(31,42,35,.08);--fs:20px;--lh:1.78}
html[data-theme="dark"]{--bg:#101511;--card:#172018;--text:#eef5ef;--muted:#a8b5aa;--accent:#8ecaa0;--accent2:#24352a;--line:#334239;--gold:#d8b85d;--danger:#f29a90;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
.app{max-width:1000px;margin:auto;min-height:100vh;padding-bottom:108px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:20px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:6px}.iconbtn,.small{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 10px;min-height:42px}.iconbtn{min-width:44px}
.controls{display:grid;grid-template-columns:1.5fr .8fr;gap:8px;margin-top:11px}
.controls select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px}
.status{margin-top:8px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.status button{font-size:12px;padding:6px 9px;border-radius:9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c79b34;margin-right:5px}.dot.ready{background:#4a9b66}.dot.err{background:#b55549}
main{padding:16px 14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.chapter-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.chapter-head h1{margin:0;font-size:27px}.chapter-head p{margin:5px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.banner{padding:12px 14px;background:var(--accent2);border-radius:14px;margin-bottom:14px}.banner strong{display:block}.banner span{font-size:13px;color:var(--muted)}
.verse{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs);line-height:var(--lh);padding:9px 11px;border-radius:12px;transition:.15s;scroll-margin-top:180px}
.verse.selected{background:var(--accent2);box-shadow:inset 3px 0 0 var(--accent)}.verse.speaking{background:color-mix(in srgb,var(--gold) 18%,var(--card));box-shadow:inset 4px 0 0 var(--gold)}
.vnum{font-family:ui-sans-serif,-apple-system,sans-serif;font-size:.61em;font-weight:850;color:var(--accent);vertical-align:super;margin-right:4px}
.star{border:0;background:transparent;color:var(--muted);font-size:17px;padding:4px;margin-left:6px}.star.on{color:var(--gold)}
.navrow{display:flex;gap:9px;margin-top:17px}.navrow button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px}.navrow .primary,.primarybtn{background:var(--accent);color:white;border-color:var(--accent)}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--accent);color:white}
.searchbox{display:flex;gap:8px}.searchbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px}.searchbox button,.primarybtn{border:0;border-radius:12px;padding:10px 15px}
.hint{font-size:13px;color:var(--muted);line-height:1.55}.result{padding:12px 0;border-bottom:1px solid var(--line)}.result:last-child{border:0}.ref{font-weight:850;color:var(--accent);font-size:14px}.result p{margin:6px 0;line-height:1.55}.result button{border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.loading{text-align:center;color:var(--muted);padding:34px}
.note{width:100%;min-height:145px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;resize:vertical}
.study-grid{display:grid;gap:10px}.study-card{border:1px solid var(--line);border-radius:14px;padding:12px}.study-card h3{margin:0 0 6px;font-size:15px}.study-card p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.saved-item{padding:12px 0;border-bottom:1px solid var(--line)}.saved-item:last-child{border:0}.saved-actions{display:flex;gap:8px;margin-top:8px}.saved-actions button{border:0;background:transparent;color:var(--accent);padding:3px 0}
.book-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bookbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px;text-align:left}.bookbtn small{display:block;color:var(--muted);margin-top:2px}
.progressbar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}.progressbar span{display:block;height:100%;background:var(--accent)}
.setting{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting label{font-weight:750}.setting small{display:block;color:var(--muted);margin-top:3px;font-weight:400}.setting select,.setting input[type="range"]{max-width:180px;background:var(--card);color:var(--text)}
.readerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:35;width:min(94vw,560px);display:none;align-items:center;gap:8px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.readerbar.show{display:flex}.readerbar .readertext{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.readerbar button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:145px;z-index:50;background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:.94}
footer{position:fixed;bottom:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.footin{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.footin button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:10px;font-size:11px}.footin button.active{background:var(--accent2);color:var(--accent);font-weight:850}
.row{display:flex;gap:8px;flex-wrap:wrap}.danger{color:var(--danger)!important}
@media(min-width:700px){.book-grid{grid-template-columns:repeat(4,1fr)}.study-grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:2fr 1fr}.verse{padding-left:15px;padding-right:15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="top">
    <div><div class="brand">Holy Bible</div><div class="sub">Instant Edition · Genesis to Revelation · WEB</div></div>
    <div class="actions">
      <button class="iconbtn" id="fontDown" aria-label="Decrease text size">A−</button>
      <button class="iconbtn" id="fontUp" aria-label="Increase text size">A+</button>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button>

</div>

</div>

<footer><div class="footin">
  <button class="active" data-view="read">📖<br>Read</button>

  <button data-view="search">🔎<br>Search</button>
  <button data-view="study">✍️<br>Study</button>
  <button data-view="saved">★<br>Saved</button>
</div></footer>

<input type="file" id="importInput" accept="application/json" hidden>

<script>
const BOOKS=[["Genesis","Gen",50,"genesis","OT"],["Exodus","Exod",40,"exodus","OT"],["Leviticus","Lev",27,"leviticus","OT"],["Numbers","Num",36,"numbers","OT"],["Deuteronomy","Deut",34,"deuteronomy","OT"],["Joshua","Josh",24,"joshua","OT"],["Judges","Judg",21,"judges","OT"],["Ruth","Ruth",4,"ruth","OT"],["1 Samuel","1Sam",31,"1-samuel","OT"],["2 Samuel","2Sam",24,"2-samuel","OT"],["1 Kings","1Kgs",22,"1-kings","OT"],["2 Kings","2Kgs",25,"2-kings","OT"],["1 Chronicles","1Chr",29,"1-chronicles","OT"],["2 Chronicles","2Chr",36,"2-chronicles","OT"],["Ezra","Ezra",10,"ezra","OT"],["Nehemiah","Neh",13,"nehemiah","OT"],["Esther","Esth",10,"esther","OT"],["Job","Job",42,"job","OT"],["Psalms","Ps",150,"psalms","OT"],["Proverbs","Prov",31,"proverbs","OT"],["Ecclesiastes","Eccl",12,"ecclesiastes","OT"],["Song of Solomon","Song",8,"song-of-solomon","OT"],["Isaiah","Isa",66,"isaiah","OT"],["Jeremiah","Jer",52,"jeremiah","OT"],["Lamentations","Lam",5,"lamentations","OT"],["Ezekiel","Ezek",48,"ezekiel","OT"],["Daniel","Dan",12,"daniel","OT"],["Hosea","Hos",14,"hosea","OT"],["Joel","Joel",3,"joel","OT"],["Amos","Amos",9,"amos","OT"],["Obadiah","Obad",1,"obadiah","OT"],["Jonah","Jonah",4,"jonah","OT"],["Micah","Mic",7,"micah","OT"],["Nahum","Nah",3,"nahum","OT"],["Habakkuk","Hab",3,"habakkuk","OT"],["Zephaniah","Zeph",3,"zephaniah","OT"],["Haggai","Hag",2,"haggai","OT"],["Zechariah","Zech",14,"zechariah","OT"],["Malachi","Mal",4,"malachi","OT"],["Matthew","Matt",28,"matthew","NT"],["Mark","Mark",16,"mark","NT"],["Luke","Luke",24,"luke","NT"],["John","John",21,"john","NT"],["Acts","Acts",28,"acts","NT"],["Romans","Rom",16,"romans","NT"],["1 Corinthians","1Cor",16,"1-corinthians","NT"],["2 Corinthians","2Cor",13,"2-corinthians","NT"],["Galatians","Gal",6,"galatians","NT"],["Ephesians","Eph",6,"ephesians","NT"],["Philippians","Phil",4,"philippians","NT"],["Colossians","Col",4,"colossians","NT"],["1 Thessalonians","1Thess",5,"1-thessalonians","NT"],["2 Thessalonians","2Thess",3,"2-thessalonians","NT"],["1 Timothy","1Tim",6,"1-timothy","NT"],["2 Timothy","2Tim",4,"2-timothy","NT"],["Titus","Titus",3,"titus","NT"],["Philemon","Phlm",1,"philemon","NT"],["Hebrews","Heb",13,"hebrews","NT"],["James","Jas",5,"james","NT"],["1 Peter","1Pet",5,"1-peter","NT"],["2 Peter","2Pet",3,"2-peter","NT"],["1 John","1John",5,"1-john","NT"],["2 John","2John",1,"2-john","NT"],["3 John","3John",1,"3-john","NT"],["Jude","Jude",1,"jude","NT"],["Revelation","Rev",22,"revelation","NT"]];
const STARTER_JAMES_1={"chapter":1,"verses":[{"number":1,"text":"James, a servant of God and of the Lord Jesus Christ, to the twelve tribes which are in the Dispersion: Greetings."},{"number":2,"text":"Count it all joy, my brothers, when you fall into various temptations,"},{"number":3,"text":"knowing that the testing of your faith produces endurance."},{"number":4,"text":"Let endurance have its perfect work, that you may be perfect and complete, lacking in nothing."},{"number":5,"text":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him."},{"number":6,"text":"But let him ask in faith, without any doubting, for he who doubts is like a wave of the sea, driven by the wind and tossed."},{"number":7,"text":"For that man shouldn’t think that he will receive anything from the Lord."},{"number":8,"text":"He is a double-minded man, unstable in all his ways."},{"number":9,"text":"Let the brother in humble circumstances glory in his high position;"},{"number":10,"text":"and the rich, in that he is made humble, because like the flower in the grass, he will pass away."},{"number":11,"text":"For the sun arises with the scorching wind and withers the grass; and the flower in it falls, and the beauty of its appearance perishes. So the rich man will also fade away in his pursuits."},{"number":12,"text":"Blessed is a person who endures temptation, for when he has been approved, he will receive the crown of life which the Lord promised to those who love him."},{"number":13,"text":"Let no man say when he is tempted, “I am tempted by God,” for God can’t be tempted by evil, and he himself tempts no one."},{"number":14,"text":"But each one is tempted when he is drawn away by his own lust and enticed."},{"number":15,"text":"Then the lust, when it has conceived, bears sin. The sin, when it is full grown, produces death."},{"number":16,"text":"Don’t be deceived, my beloved brothers."},{"number":17,"text":"Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation nor turning shadow."},{"number":18,"text":"Of his own will he gave birth to us by the word of truth, that we should be a kind of first fruits of his creatures."},{"number":19,"text":"So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger;"},{"number":20,"text":"for the anger of man doesn’t produce the righteousness of God."},{"number":21,"text":"Therefore, putting away all filthiness and overflowing of wickedness, receive with humility the implanted word, which is able to save your souls."},{"number":22,"text":"But be doers of the word, and not only hearers, deluding your own selves."},{"number":23,"text":"For if anyone is a hearer of the word and not a doer, he is like a man looking at his natural face in a mirror;"},{"number":24,"text":"for he sees himself, and goes away, and immediately forgets what kind of man he was."},{"number":25,"text":"But he who looks into the perfect law of freedom and continues, not being a hearer who forgets but a doer of the work, this man will be blessed in what he does."},{"number":26,"text":"If anyone among you thinks himself to be religious while he doesn’t bridle his tongue, but deceives his heart, this man’s religion is worthless."},{"number":27,"text":"Pure religion and undefiled before our God and Father is this: to visit the fatherless and widows in their affliction, and to keep oneself unstained by the world."}]};
const FULL_SOURCE='https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/web/web.json';
const API='https://api.midvash.com/v1/web';
const TOTAL_CHAPTERS=1189;
const HOT_CACHE_LIMIT=30;

const state={
  book:localStorage.getItem('b_book')||'James',
  chapter:+(localStorage.getItem('b_chapter')||1),
  view:'read',
  chapterData:null,
  selectedVerse:null,
  font:+(localStorage.getItem('b_font')||20),
  lineHeight:+(localStorage.getItem('b_line_height')||1.78),
  themePref:localStorage.getItem('b_theme_pref')||localStorage.getItem('b_theme')||'light',
  bible:null,
  source:'online',
  speechRate:+(localStorage.getItem('b_speech_rate')||0.9),
  voiceName:localStorage.getItem('b_voice_name')||''
};

const content=document.getElementById('content');
const bookSelect=document.getElementById('bookSelect');
const chapterSelect=document.getElementById('chapterSelect');
const dataStatus=document.getElementById('dataStatus');
const themeColor=document.getElementById('themeColor');
const readerBar=document.getElementById('readerBar');
const readerText=document.getElementById('readerText');
const pauseSpeechBtn=document.getElementById('pauseSpeechBtn');
const stopSpeechBtn=document.getElementById('stopSpeechBtn');
const toastEl=document.getElementById('toast');

document.documentElement.style.setProperty('--fs',state.font+'px');
document.documentElement.style.setProperty('--lh',state.lineHeight);

function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function key(s){return s.replace(/\s+/g,'_').replace(/:/g,'-')}
function currentBook(){return BOOKS.find(b=>b[0]===state.book)||BOOKS[0]}
function favs(){try{return JSON.parse(localStorage.getItem('b_favs')||'{}')}catch{return {}}}
function notes(){try{return JSON.parse(localStorage.getItem('b_notes')||'{}')}catch{return {}}}
function progress(){try{return JSON.parse(localStorage.getItem('b_progress')||'{}')}catch{return {}}}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1800)}
function setStatus(text,kind=''){dataStatus.innerHTML=`<span class="dot ${kind}"></span>${esc(text)}`}
function online(){return navigator.onLine!==false}

function resolveTheme(){
  if(state.themePref==='system') return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  return state.themePref==='dark'?'dark':'light';
}
function applyTheme(){
  const t=resolveTheme();
  document.documentElement.dataset.theme=t;
  themeColor.setAttribute('content',t==='dark'?'#101511':'#f4f0e7');
}
applyTheme();
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.themePref==='system')applyTheme()})}catch{}

BOOKS.forEach(([n])=>{const o=document.createElement('option');o.value=n;o.textContent=n;bookSelect.appendChild(o)});
bookSelect.value=state.book;
function fillChapters(){chapterSelect.innerHTML='';for(let i=1;i<=currentBook()[2];i++){const o=document.createElement('option');o.value=i;o.textContent='Chapter '+i;chapterSelect.appendChild(o)}chapterSelect.value=state.chapter}
fillChapters();

function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('full_bible_db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('data'))r.result.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbGet(k){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('data','readonly');const r=tx.objectStore('data').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(k,v){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function dbDelete(k){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').delete(k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}

function bibleBooks(){return state.bible?.books||[]}
function findFullBook(name){const def=BOOKS.find(b=>b[0]===name);if(!def)return null;return bibleBooks().find(b=>b.englishName===name||b.book===def[1]||b.book===name)||null}
function normalizeChapter(ch,chapterFallback=state.chapter){if(!ch)return null;const verses=(ch.verses||[]).map((v,i)=>({number:+(v.number??v.verse??i+1),text:String(v.text??v.value??'').trim()}));return {chapter:+(ch.chapter??ch.number??chapterFallback),verses}}
function parseApiChapter(j,chapterFallback){const d=j?.data??j;const candidate=d?.chapter?.verses?d.chapter:d?.verses?d:d?.data?.verses?d.data:null;return normalizeChapter(candidate,chapterFallback)}

function hotKey(book=state.book,chapter=state.chapter){return `${book}|${chapter}`}
function readHotChapter(book=state.book,chapter=state.chapter){
  try{const hot=JSON.parse(localStorage.getItem('b_hot_chapters')||'{}');return hot[hotKey(book,chapter)]?.data||null}catch{return null}
}
function saveHotChapter(book,chapter,ch){
  try{
    const hot=JSON.parse(localStorage.getItem('b_hot_chapters')||'{}');
    hot[hotKey(book,chapter)]={at:Date.now(),data:ch};
    Object.keys(hot).sort((a,b)=>(hot[b]?.at||0)-(hot[a]?.at||0)).slice(HOT_CACHE_LIMIT).forEach(k=>delete hot[k]);
    localStorage.setItem('b_hot_chapters',JSON.stringify(hot));
  }catch{}
}
function saveLastChapter(book,chapter,ch){
  try{localStorage.setItem('b_last_chapter',JSON.stringify({key:`${book}|${chapter}`,data:ch}))}catch{}
  saveHotChapter(book,chapter,ch);
}
function readLastChapter(){
  const hot=readHotChapter();
  if(hot?.verses?.length)return hot;
  try{
    const x=JSON.parse(localStorage.getItem('b_last_chapter')||'null');
    return x&&x.key===`${state.book}|${state.chapter}`&&x.data?.verses?.length?x.data:null;
  }catch{return null}
}
function setProgress(book=state.book,chapter=state.chapter){const p=progress();p[book+' '+chapter]=true;localStorage.setItem('b_progress',JSON.stringify(p))}

async function fetchChapterApi(book=state.book,chapter=state.chapter){
  const def=BOOKS.find(b=>b[0]===book); if(!def)throw new Error('book');
  const r=await fetch(`${API}/${def[3]}/${chapter}`,{cache:'no-cache'});
  if(!r.ok)throw new Error('chapter');
  return parseApiChapter(await r.json(),chapter);
}
async function loadFullBible(force=false){
  try{
    const cached=await dbGet('web_full');
    if(cached?.books?.length===66){
      state.bible=cached;state.source='offline';
      setStatus('Full Bible ready offline','ready');
      document.getElementById('offlineBtn').textContent='Saved offline ✓';
      return true;
    }
    if(!force){setStatus(online()?'Online · chapters cache as you read':'Offline · cached chapters only',online()?'ready':'err');return false}
    if(!online())throw new Error('offline');
    setStatus('Downloading all 66 books…');
    const r=await fetch(FULL_SOURCE,{cache:'no-cache'});
    if(!r.ok)throw new Error('download');
    const data=await r.json();
    if(!data?.books||data.books.length<66)throw new Error('bad data');
    state.bible=data;state.source='offline';
    await dbPut('web_full',data);
    try{await navigator.storage?.persist?.()}catch{}
    localStorage.setItem('b_offline_saved','1');
    setStatus('Full Bible ready offline','ready');
    document.getElementById('offlineBtn').textContent='Saved offline ✓';
    return true;
  }catch(e){
    setStatus(online()?'Could not save full Bible':'Offline · cached chapters only','err');
    return false;
  }
}
function findChapterInFull(book,chapter){
  if(!state.bible)return null;
  const b=findFullBook(book); if(!b)return null;
  const raw=b.chapters?.find(x=>+(x.chapter??x.number)===chapter)||b.chapters?.[chapter-1];
  return normalizeChapter(raw,chapter);
}
async function loadChapter({refresh=false}={}){
  const requestedBook=state.book, requestedChapter=state.chapter;
  let ch=findChapterInFull(requestedBook,requestedChapter)||readHotChapter(requestedBook,requestedChapter);
  if(!ch&&requestedBook==='James'&&requestedChapter===1)ch=STARTER_JAMES_1;

  if(ch?.verses?.length){
    state.chapterData=ch;saveLastChapter(requestedBook,requestedChapter,ch);setProgress(requestedBook,requestedChapter);render();
    if(state.bible&&!refresh)return ch;
  }else{
    state.chapterData=null;renderRead();
  }

  if(!online())return ch||null;
  try{
    const fresh=await fetchChapterApi(requestedBook,requestedChapter);
    if(!fresh?.verses?.length)throw new Error('empty');
    saveLastChapter(requestedBook,requestedChapter,fresh);
    if(state.book===requestedBook&&state.chapter===requestedChapter){
      state.chapterData=fresh;setProgress();render();prefetchNeighbors();
    }
    return fresh;
  }catch{
    if(!state.chapterData){
      content.innerHTML=`<section class="panel"><div class="chapter-head"><div><h1>${esc(requestedBook)} ${requestedChapter}</h1><p>This chapter is not cached yet.</p></div></div><p class="hint">Reconnect to the internet once, then this chapter will be remembered for faster opening.</p><button class="small" onclick="loadChapter({refresh:true})">Try again</button></section>`;
    }
    return ch||null;
  }
}
async function fetchAndCache(book,chapter){
  if(!online()||readHotChapter(book,chapter)||findChapterInFull(book,chapter))return;
  try{const d=await fetchChapterApi(book,chapter);if(d?.verses?.length)saveHotChapter(book,chapter,d)}catch{}
}
function neighborRef(offset){
  let bi=BOOKS.findIndex(b=>b[0]===state.book),ch=state.chapter;
  if(offset<0){if(ch>1)ch--;else if(bi>0){bi--;ch=BOOKS[bi][2]}else return null}
  else{if(ch<BOOKS[bi][2])ch++;else if(bi<BOOKS.length-1){bi++;ch=1}else return null}
  return {book:BOOKS[bi][0],chapter:ch};
}
function prefetchNeighbors(){[-1,1].forEach(o=>{const n=neighborRef(o);if(n)fetchAndCache(n.book,n.chapter)})}

function verseList(){return state.chapterData?.verses||[]}
function verseNum(v,i){return +(v.number??i+1)}
function verseText(v){return String(v.text||'').trim()}
function reference(n){return `${state.book} ${state.chapter}:${n}`}
function esvUrl(){return `https://www.biblegateway.com/passage/?search=${encodeURIComponent(state.book+' '+state.chapter)}&version=ESV`}
function updateUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.set('book',state.book);u.searchParams.set('chapter',state.chapter);
    if(state.selectedVerse)u.searchParams.set('verse',state.selectedVerse);else u.searchParams.delete('verse');
    history.replaceState(null,'',u);
  }catch{}
}
function renderRead(){
  const fs=favs();
  let h=`<div class="banner"><strong>World English Bible</strong><span>${state.bible?'Full Bible stored on this device.':'Recent chapters are cached automatically.'}</span></div>
  <section class="panel"><div class="chapter-head"><div><h1>${esc(state.book)} ${state.chapter}</h1><p>${verseList().length?verseList().length+' verses · reading position saved':'Opening chapter…'}</p></div>
  <div class="head-actions">
    <button class="small" onclick="toggleReadBible()">🔊 Read aloud</button>
    <button class="small" onclick="shareChapter()">↗ Share</button>
    <button class="small" onclick="window.open('${esvUrl()}','_blank')">ESV ↗</button>
  </div></div><div>`;
  if(!verseList().length)h+='<div class="loading">Preparing this uncached chapter…</div>';
  verseList().forEach((v,i)=>{
    const n=verseNum(v,i),ref=reference(n),k=key(ref);
    h+=`<div class="verse ${state.selectedVerse===n?'selected':''}" id="verse-${n}" data-verse="${n}" onclick="selectVerse(${n})"><span class="vnum">${n}</span>${esc(verseText(v))}<button class="star ${fs[k]?'on':''}" onclick="event.stopPropagation();toggleFav(${n})" aria-label="Save verse ${n}">★</button></div>`;
  });
  h+=`</div><div class="navrow"><button onclick="prevChapter()">← Previous</button><button class="primary" onclick="nextChapter()">Next →</button></div></section>`;
  content.innerHTML=h;updateSpeechUI();
}
function renderBooks(){
  const p=progress(),done=Object.keys(p).filter(k=>p[k]).length,pct=Math.round(done/TOTAL_CHAPTERS*100);
  const group=t=>BOOKS.filter(b=>b[4]===t).map(b=>`<button class="bookbtn" onclick="openBook('${b[0].replace(/'/g,"\\'")}')"><strong>${esc(b[0])}</strong><small>${b[2]} chapter${b[2]===1?'':'s'}</small></button>`).join('');
  content.innerHTML=`<section class="panel"><div class="chapter-head"><div><h1 style="margin-top:0;font-size:25px">All 66 Books</h1><p>${done} of ${TOTAL_CHAPTERS} chapters opened · ${pct}%</p></div><button class="small" onclick="randomChapter()">🎲 Random</button></div><div class="progressbar"><span style="width:${pct}%"></span></div></section>
  <section class="panel"><h2 style="font-size:19px">Old Testament · 39 books</h2><div class="book-grid">${group('OT')}</div></section>
  <section class="panel"><h2 style="font-size:19px">New Testament · 27 books</h2><div class="book-grid">${group('NT')}</div></section>`;
}
function renderSearch(){
  content.innerHTML=`<section class="panel"><h1 style="margin-top:0;font-size:25px">Search the Full Bible</h1><div class="searchbox"><input id="q" placeholder="wisdom, faith, fear, John 3:16…" onkeydown="if(event.key==='Enter')runSearch()"><button onclick="runSearch()">Search</button></div><p class="hint">References work immediately. Full-text search works best after the complete Bible is saved offline.</p></section><section class="panel" id="results"><div class="empty">Search Scripture or type a reference.</div></section>`;
}
function normalizeBookQuery(s){return s.toLowerCase().replace(/\./g,'').replace(/\s+/g,' ').trim()}
function parseRef(q){
  const m=q.trim().match(/^(.+?)\s+(\d+)(?::(\d+))?$/);if(!m)return null;
  const wanted=normalizeBookQuery(m[1]);
  const b=BOOKS.find(x=>normalizeBookQuery(x[0])===wanted||normalizeBookQuery(x[1])===wanted);
  if(!b)return null;
  const ch=+m[2],v=m[3]?+m[3]:null;
  if(ch<1||ch>b[2])return null;
  return {book:b[0],chapter:ch,verse:v};
}
async function runSearch(){
  const qel=document.getElementById('q'),out=document.getElementById('results'),raw=qel.value.trim();if(!raw)return;
  const ref=parseRef(raw);if(ref){goTo(ref.book,ref.chapter,ref.verse||1);return}
  if(!state.bible){
    out.innerHTML='<div class="loading">Preparing the full Bible for search…</div>';
    const ok=await loadFullBible(true);
    if(!ok){out.innerHTML='<div class="empty">Full-text search needs the complete Bible. Connect to the internet and tap “Make entire Bible offline”.</div>';return}
  }
  const q=raw.toLowerCase();if(q.length<2){out.innerHTML='<div class="empty">Type at least 2 letters.</div>';return}
  const found=[];
  for(const b of bibleBooks()){
    const name=b.englishName||BOOKS.find(x=>x[1]===b.book)?.[0]||b.book;
    for(const ch of b.chapters||[]){
      const cn=+(ch.chapter??ch.number);
      for(const v of ch.verses||[]){
        const text=String(v.text??v.value??'');
        if(text.toLowerCase().includes(q)){found.push({book:name,chapter:cn,verse:+(v.number??v.verse),text});if(found.length>=200)break}
      }
      if(found.length>=200)break;
    }
    if(found.length>=200)break;
  }
  out.innerHTML=found.length?found.map(x=>`<div class="result"><div class="ref">${esc(x.book)} ${x.chapter}:${x.verse}</div><p>${esc(x.text)}</p><button onclick="goTo('${x.book.replace(/'/g,"\\'")}',${x.chapter},${x.verse})">Open verse →</button></div>`).join(''):'<div class="empty">No matching verses found.</div>';
}
function selected(){
  const n=state.selectedVerse||1,v=verseList().find((x,i)=>verseNum(x,i)===n);
  return v?{n,text:verseText(v),ref:reference(n)}:null;
}
function renderStudy(){
  const s=selected();
  if(!s){content.innerHTML='<section class="panel empty">Tap a verse in Read mode, then open Study.</section>';return}
  const ns=notes(),saved=ns[key(s.ref)]?.note||'';
  content.innerHTML=`<section class="panel"><div class="chapter-head"><div><h1>${esc(s.ref)}</h1><p>${esc(s.text)}</p></div><div class="head-actions"><button class="small" onclick="speakSelected()">🔊 Hear</button><button class="small" onclick="copySelected()">Copy</button><button class="small" onclick="shareSelected()">Share</button></div></div></section>
  <section class="study-grid"><div class="study-card"><h3>Observe</h3><p>What words, commands, promises, warnings, or ideas stand out?</p></div><div class="study-card"><h3>Understand</h3><p>What does the verse mean in the chapter around it?</p></div><div class="study-card"><h3>Apply</h3><p>What can you believe, practise, remember, or change today?</p></div><div class="study-card"><h3>Pray</h3><p>Turn the truth of the verse into a short prayer.</p></div></section>
  <section class="panel"><h3 style="margin-top:0">My note</h3><textarea class="note" id="noteBox" placeholder="Write what you understand…">${esc(saved)}</textarea><button class="primarybtn" style="margin-top:8px" onclick="saveNote()">Save note</button><span class="hint" id="noteSaved" style="margin-left:8px"></span></section>`;

function renderSaved(){
  const fs=favs(),ns=notes(),fkeys=Object.keys(fs).filter(k=>fs[k]),nkeys=Object.keys(ns).filter(k=>ns[k]);
  let h='<section class="panel"><div class="chapter-head"><div><h1 style="margin-top:0;font-size:25px">Saved</h1><p>Favourite verses and study notes stored on this device.</p></div><button class="small" onclick="exportData()">Backup</button></div>';
  if(!fkeys.length&&!nkeys.length)h+='<div class="empty">Saved verses and study notes will appear here.</div>';
  else{
    if(fkeys.length){h+='<h3>Favourite verses</h3>';fkeys.forEach(k=>{const x=fs[k];h+=`<div class="saved-item"><div class="ref">${esc(x.ref)}</div><div style="margin-top:5px;line-height:1.55">${esc(x.text)}</div><div class="saved-actions"><button onclick="openSavedRef('${esc(x.ref)}')">Open</button><button onclick="removeFav('${k}')">Remove</button></div></div>`})}
    if(nkeys.length){h+='<h3 style="margin-top:22px">Study notes</h3>';nkeys.forEach(k=>{const x=ns[k];h+=`<div class="saved-item"><div class="ref">${esc(x.ref)}</div><div style="margin-top:5px;line-height:1.55">${esc(x.note)}</div><div class="saved-actions"><button onclick="openSavedRef('${esc(x.ref)}')">Open</button></div></div>`})}
  }
  h+='</section>';content.innerHTML=h;
}
function renderSettings(){
  const voices=speechSynthesis?.getVoices?.()||[];
  const voiceOptions=['<option value="">Automatic best voice</option>'].concat(voices.filter(v=>v.lang.startsWith('en')).map(v=>`<option value="${esc(v.name)}" ${v.name===state.voiceName?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`)).join('');
  content.innerHTML=`<section class="panel"><h1 style="margin-top:0;font-size:25px">Settings</h1>
    <div class="setting"><div><label>Theme</label><small>Light, dark, or follow iPhone.</small></div><select id="themePref"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></div>

    <div class="setting"><div><label>Read-aloud voice</label><small>Uses voices available on this iPhone.</small></div><select id="voiceSelect">${voiceOptions}</select></div>

    <div class="setting"><div><label>Offline Bible</label><small>${state.bible?'All 66 books are available offline.':'Download once for full offline reading and search.'}</small></div><button class="small" onclick="document.getElementById('offlineBtn').click()">${state.bible?'Saved ✓':'Download'}</button></div>
    <div class="setting"><div><label>Backup my data</label><small>Export favourites, notes, progress, and preferences.</small></div><div class="row"><button class="small" onclick="exportData()">Export</button><button class="small" onclick="document.getElementById('importInput').click()">Import</button></div></div>
    <div class="setting"><div><label>Add to Home Screen</label><small>In Safari: Share → Add to Home Screen.</small></div><span>📱</span></div>
  </section>`;
  document.getElementById('themePref').value=state.themePref;
  document.getElementById('themePref').onchange=e=>{state.themePref=e.target.value;localStorage.setItem('b_theme_pref',state.themePref);applyTheme()};
  document.getElementById('fontRange').oninput=e=>{state.font=+e.target.value;localStorage.setItem('b_font',state.font);document.documentElement.style.setProperty('--fs',state.font+'px');renderSettings()};
  document.getElementById('lineRange').oninput=e=>{state.lineHeight=+e.target.value;localStorage.setItem('b_line_height',state.lineHeight);document.documentElement.style.setProperty('--lh',state.lineHeight);};
  document.getElementById('voiceSelect').onchange=e=>{state.voiceName=e.target.value;localStorage.setItem('b_voice_name',state.voiceName)};
  document.getElementById('speedRange').oninput=e=>{state.speechRate=+e.target.value;localStorage.setItem('b_speech_rate',state.speechRate);};
}
function render(){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  if(state.view==='read')renderRead();
  else if(state.view==='books')renderBooks();
  else if(state.view==='search')renderSearch();
  else if(state.view==='study')renderStudy();
  else if(state.view==='saved')renderSaved();
  else renderSettings();
}

function switchView(v){state.view=v;render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
document.getElementById('settingsBtn').onclick=()=>{state.view='settings';render()};

bookSelect.onchange=()=>{stopReading();state.book=bookSelect.value;state.chapter=1;state.selectedVerse=null;fillChapters();syncNav()};
chapterSelect.onchange=()=>{stopReading();state.chapter=+chapterSelect.value;state.selectedVerse=null;syncNav()};
function persistNav(){localStorage.setItem('b_book',state.book);localStorage.setItem('b_chapter',state.chapter);updateUrl()}
function syncNav(){
  bookSelect.value=state.book;fillChapters();chapterSelect.value=state.chapter;persistNav();state.selectedVerse=null;
  state.chapterData=findChapterInFull(state.book,state.chapter)||readHotChapter(state.book,state.chapter)||((state.book==='James'&&state.chapter===1)?STARTER_JAMES_1:null);
  state.view='read';render();loadChapter();window.scrollTo({top:0,behavior:'auto'});
}
function prevChapter(){const i=BOOKS.findIndex(b=>b[0]===state.book);if(state.chapter>1)state.chapter--;else if(i>0){state.book=BOOKS[i-1][0];state.chapter=BOOKS[i-1][2]}syncNav()}
function nextChapter(){const i=BOOKS.findIndex(b=>b[0]===state.book);if(state.chapter<currentBook()[2])state.chapter++;else if(i<BOOKS.length-1){state.book=BOOKS[i+1][0];state.chapter=1}syncNav()}
function openBook(book){state.book=book;state.chapter=1;syncNav()}
function goTo(book,ch,v=1){
  if(!BOOKS.some(b=>b[0]===book))return;
  stopReading();state.book=book;state.chapter=Math.min(Math.max(+ch,1),BOOKS.find(b=>b[0]===book)[2]);state.selectedVerse=+v||1;state.view='read';
  bookSelect.value=book;fillChapters();chapterSelect.value=state.chapter;persistNav();
  state.chapterData=findChapterInFull(book,state.chapter)||readHotChapter(book,state.chapter)||null;
  render();
  loadChapter().then(()=>setTimeout(()=>document.getElementById(`verse-${state.selectedVerse}`)?.scrollIntoView({behavior:'smooth',block:'center'}),150));
}
function selectVerse(n){state.selectedVerse=n;updateUrl();renderRead()}
function toggleFav(n){
  const v=verseList().find((x,i)=>verseNum(x,i)===n);if(!v)return;
  const ref=reference(n),k=key(ref),fs=favs();
  if(fs[k]){delete fs[k];toast('Removed from Saved')}else{fs[k]={ref,text:verseText(v)};toast('Saved verse ★')}
  localStorage.setItem('b_favs',JSON.stringify(fs));render();
}
function removeFav(k){const fs=favs();delete fs[k];localStorage.setItem('b_favs',JSON.stringify(fs));renderSaved()}
function saveNote(){
  const s=selected();if(!s)return;
  const box=document.getElementById('noteBox'),ns=notes(),k=key(s.ref);
  if(box.value.trim())ns[k]={ref:s.ref,note:box.value.trim()};else delete ns[k];
  localStorage.setItem('b_notes',JSON.stringify(ns));document.getElementById('noteSaved').textContent='Saved ✓';toast('Note saved');
}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch{toast('Could not copy')}}
function copySelected(){const s=selected();if(s)copyText(`${s.ref} — ${s.text}`)}
async function shareText(title,text,url=''){
  try{if(navigator.share)await navigator.share({title,text,url});else await copyText(`${text}${url?'\n'+url:''}`)}catch(e){if(e?.name!=='AbortError')toast('Could not share')}
}
function shareSelected(){const s=selected();if(s)shareText(s.ref,`${s.ref} — ${s.text}`,location.href)}
function shareChapter(){shareText(`${state.book} ${state.chapter}`,`Read ${state.book} ${state.chapter}`,location.href)}
function openSavedRef(ref){const p=parseRef(ref);if(p)goTo(p.book,p.chapter,p.verse||1)}
function randomChapter(){const b=BOOKS[Math.floor(Math.random()*BOOKS.length)];state.book=b[0];state.chapter=1+Math.floor(Math.random()*b[2]);syncNav()}

document.getElementById('fontUp').onclick=()=>{state.font=Math.min(32,state.font+2);document.documentElement.style.setProperty('--fs',state.font+'px');localStorage.setItem('b_font',state.font);toast(`Text ${state.font}px`)};
document.getElementById('fontDown').onclick=()=>{state.font=Math.max(16,state.font-2);document.documentElement.style.setProperty('--fs',state.font+'px');localStorage.setItem('b_font',state.font);toast(`Text ${state.font}px`)};
document.getElementById('themeBtn').onclick=()=>{state.themePref=resolveTheme()==='dark'?'light':'dark';localStorage.setItem('b_theme_pref',state.themePref);applyTheme()};
document.getElementById('offlineBtn').onclick=async()=>{
  const btn=document.getElementById('offlineBtn');btn.disabled=true;btn.textContent='Saving full Bible…';
  const ok=await loadFullBible(true);btn.disabled=false;btn.textContent=ok?'Saved offline ✓':'Try offline save again';
  if(ok){toast('Full Bible saved offline');await loadChapter()}
};

let bibleSpeaking=false,speechPaused=false,verseQueue=[],speechIndex=0,currentUtterance=null;
function englishVoices(){return (speechSynthesis.getVoices?.()||[]).filter(v=>v.lang?.toLowerCase().startsWith('en'))}
function getBestVoice(){
  const voices=englishVoices();
  if(state.voiceName){const chosen=voices.find(v=>v.name===state.voiceName);if(chosen)return chosen}
  const preferred=['Karen','Lee','Samantha','Ava','Daniel'];
  for(const name of preferred){const v=voices.find(x=>x.name.toLowerCase().includes(name.toLowerCase()));if(v)return v}
  return voices.find(v=>v.lang==='en-AU')||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang==='en-US')||voices[0]||null;
}
function buildSpeechQueue(startAtSelected=true){
  const list=verseList();
  let start=0;
  if(startAtSelected&&state.selectedVerse){const i=list.findIndex((v,idx)=>verseNum(v,idx)===state.selectedVerse);if(i>=0)start=i}
  return list.slice(start).map((v,idx)=>({n:verseNum(v,start+idx),text:verseText(v)}));
}
function updateSpeechUI(){
  readerBar.classList.toggle('show',bibleSpeaking);
  pauseSpeechBtn.textContent=speechPaused?'▶️':'⏸';
  if(bibleSpeaking&&verseQueue[speechIndex])readerText.textContent=`${state.book} ${state.chapter}:${verseQueue[speechIndex].n}`;
  document.querySelectorAll('.verse').forEach(el=>el.classList.remove('speaking'));
  if(bibleSpeaking&&verseQueue[speechIndex])document.getElementById(`verse-${verseQueue[speechIndex].n}`)?.classList.add('speaking');
}
function speakCurrent(){
  if(!bibleSpeaking||speechIndex>=verseQueue.length){stopReading();return}
  const item=verseQueue[speechIndex];
  const u=new SpeechSynthesisUtterance(`${item.n}. ${item.text}`);
  currentUtterance=u;const voice=getBestVoice();if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-AU';
  u.rate=state.speechRate;u.pitch=1;u.volume=1;
  u.onend=()=>{if(!bibleSpeaking)return;speechIndex++;updateSpeechUI();setTimeout(speakCurrent,180)};
  u.onerror=()=>{if(!bibleSpeaking)return;speechIndex++;setTimeout(speakCurrent,50)};
  updateSpeechUI();
  document.getElementById(`verse-${item.n}`)?.scrollIntoView({behavior:'smooth',block:'center'});
  speechSynthesis.speak(u);
}
function toggleReadBible(){
  if(!('speechSynthesis' in window)){alert('Read aloud is not supported on this device.');return}
  if(bibleSpeaking){stopReading();return}
  verseQueue=buildSpeechQueue(true);if(!verseQueue.length){toast('Open a Bible chapter first');return}
  speechSynthesis.cancel();speechIndex=0;bibleSpeaking=true;speechPaused=false;updateSpeechUI();speakCurrent();
}
function speakSelected(){
  const s=selected();if(!s)return;
  stopReading();verseQueue=[{n:s.n,text:s.text}];speechIndex=0;bibleSpeaking=true;speechPaused=false;updateSpeechUI();speakCurrent();
}
function stopReading(){try{speechSynthesis.cancel()}catch{}bibleSpeaking=false;speechPaused=false;verseQueue=[];speechIndex=0;currentUtterance=null;updateSpeechUI()}
pauseSpeechBtn.onclick=()=>{if(!bibleSpeaking)return;if(speechPaused){speechSynthesis.resume();speechPaused=false}else{speechSynthesis.pause();speechPaused=true}updateSpeechUI()};
stopSpeechBtn.onclick=stopReading;
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(state.view==='settings')renderSettings()}}catch{}

function exportData(){
  const data={
    version:1,
    exportedAt:new Date().toISOString(),
    favourites:favs(),notes:notes(),progress:progress(),
    preferences:{book:state.book,chapter:state.chapter,font:state.font,lineHeight:state.lineHeight,themePref:state.themePref,speechRate:state.speechRate,voiceName:state.voiceName}
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='holy-bible-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById('importInput').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(data.favourites)localStorage.setItem('b_favs',JSON.stringify(data.favourites));
    if(data.notes)localStorage.setItem('b_notes',JSON.stringify(data.notes));
    if(data.progress)localStorage.setItem('b_progress',JSON.stringify(data.progress));
    toast('Backup imported');render();
  }catch{toast('That backup file could not be read')}
  e.target.value='';
};

window.addEventListener('online',()=>setStatus(state.bible?'Full Bible ready offline':'Online · chapters cache as you read','ready'));
window.addEventListener('offline',()=>setStatus(state.bible?'Full Bible ready offline':'Offline · cached chapters only',state.bible?'ready':'err'));

function bootFromUrl(){
  try{
    const u=new URL(location.href),b=u.searchParams.get('book'),ch=+u.searchParams.get('chapter'),v=+u.searchParams.get('verse');
    const def=BOOKS.find(x=>x[0]===b);
    if(def&&ch>=1&&ch<=def[2]){state.book=b;state.chapter=ch;if(v>0)state.selectedVerse=v}
  }catch{}
}
(async function boot(){
  bootFromUrl();bookSelect.value=state.book;fillChapters();chapterSelect.value=state.chapter;
  setStatus('Instant mode','ready');
  let instant=readLastChapter()||findChapterInFull(state.book,state.chapter);
  if(!instant&&state.book==='James'&&state.chapter===1)instant=STARTER_JAMES_1;
  if(!instant){state.book='James';state.chapter=1;bookSelect.value='James';fillChapters();chapterSelect.value=1;instant=STARTER_JAMES_1}
  state.chapterData=instant;saveLastChapter(state.book,state.chapter,instant);setProgress();persistNav();render();prefetchNeighbors();
  await loadFullBible(false);
  if(state.bible){state.chapterData=findChapterInFull(state.book,state.chapter)||state.chapterData;render()}
  else if(online())loadChapter();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      reg.update();
    }catch{}
  });
}
</script>
